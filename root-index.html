<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>limao · 李貌 出品</title>
<meta name="description" content="把 AI 变成真正能用的生产力工具 —— limao 的两个开源产品：Dagong（桌面端 AI Agent 工作台）与 RiXing（macOS 菜单栏生产力 + 端侧 AI）。" />
<meta property="og:title" content="limao · 李貌 出品" />
<meta property="og:description" content="把 AI 变成真正能用的生产力工具。Dagong · RiXing。" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600&family=Noto+Serif+SC:wght@300;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0f172a; --ink-2:#334155; --ink-3:#64748b; --ink-4:#94a3b8;
    --line:rgba(15,23,42,.10); --line-soft:rgba(15,23,42,.06);
    --indigo:#4f46e5; --cyan:#0891b2; --accent:linear-gradient(120deg,#6366f1,#06b6d4);
    --card:rgba(255,255,255,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Sans SC","Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink); min-height:100vh; line-height:1.65;
    background:
      radial-gradient(820px 460px at 86% -8%, rgba(99,102,241,.12), transparent 56%),
      radial-gradient(680px 460px at 4% 112%, rgba(6,182,212,.10), transparent 56%),
      linear-gradient(180deg,#fbfcfe 0%,#f4f6fb 100%);
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center; padding:0 20px;
    position:relative; overflow-x:hidden;
  }
  /* faint tech grid */
  .bg-grid{position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(15,23,42,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.045) 1px, transparent 1px);
    background-size:42px 42px;
    -webkit-mask-image:radial-gradient(ellipse 78% 58% at 50% 26%, #000 28%, transparent 82%);
    mask-image:radial-gradient(ellipse 78% 58% at 50% 26%, #000 28%, transparent 82%);
  }
  .wrap{width:100%; max-width:1000px; flex:1; display:flex; flex-direction:column; position:relative; z-index:1}

  /* byline */
  .byline{text-align:center; margin-top:70px; letter-spacing:6px; text-transform:uppercase; font-size:13px; color:var(--ink-4)}
  .byline b{font-family:"Playfair Display",serif; font-style:italic; font-weight:500; font-size:20px; letter-spacing:1px;
    background:var(--accent); -webkit-background-clip:text; background-clip:text; color:transparent; text-transform:none}

  /* hero */
  .hero{text-align:center; margin:30px 0 6px}
  .hero h1{
    font-family:"Noto Serif SC",serif; font-weight:300; font-size:clamp(30px,5.2vw,54px); line-height:1.22;
    letter-spacing:.5px; color:var(--ink);
  }
  .hero h1 .hl{font-weight:500; background:var(--accent); -webkit-background-clip:text; background-clip:text; color:transparent}
  .hero .en{margin-top:16px; font-family:"Space Grotesk",sans-serif; font-size:14px; letter-spacing:3px; text-transform:uppercase; color:var(--ink-3)}
  .hero p{max-width:600px; margin:18px auto 0; font-size:16px; font-weight:300; color:var(--ink-2)}
  .divider{width:64px; height:2px; margin:30px auto 0; background:var(--accent); border-radius:2px; opacity:.85}

  /* cards */
  .cards{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin:54px 0 8px}
  .card{
    position:relative; background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line-soft); border-radius:22px; padding:30px 28px 26px; overflow:hidden;
    box-shadow:0 12px 36px rgba(15,23,42,.07); transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    display:flex; flex-direction:column;
  }
  .card::before{content:""; position:absolute; inset:0; border-radius:22px; padding:1.4px;
    background:var(--accent); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .3s ease}
  .card:hover{transform:translateY(-5px); box-shadow:0 22px 54px rgba(79,70,229,.13); border-color:transparent}
  .card:hover::before{opacity:1}
  .card .tag{font-family:"Space Grotesk",sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-4)}
  .card h2{font-family:"Noto Serif SC",serif; font-weight:500; font-size:27px; margin:9px 0 3px; display:flex; align-items:center; gap:11px; color:var(--ink)}
  .card h2 .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px rgba(99,102,241,.7)}
  .card .role{font-family:"Space Grotesk","Noto Sans SC",sans-serif; font-size:13.5px; letter-spacing:.5px; color:var(--cyan); font-weight:500; margin-bottom:15px}
  .card .desc{font-size:14.5px; font-weight:300; color:var(--ink-2); flex:1}
  .card .feats{display:flex; flex-wrap:wrap; gap:8px; margin:17px 0 2px}
  .card .feats span{font-size:12px; font-weight:400; color:var(--ink-2); padding:5px 11px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.55)}
  .card .actions{display:flex; align-items:center; gap:16px; margin-top:22px; flex-wrap:wrap}
  .btn{ align-items:center; gap:7px; text-decoration:none; font-weight:500; font-size:15px;
    padding:2px 2px; color:#fff; width:100%;
     transition:filter .2s ease, transform .2s ease}
  .btn:hover{filter:brightness(1.05); transform:translateX(3px)}
  .ghost{font-family:"Space Grotesk","Noto Sans SC",sans-serif; font-size:13.5px; color:var(--ink-3); text-decoration:none; transition:color .2s}
  .ghost:hover{color:var(--indigo)}

  /* footer */
  footer{margin:58px 0 50px; text-align:center; color:var(--ink-4); font-size:13px; line-height:2; font-weight:300}
  footer a{color:var(--ink-3); text-decoration:none}
  footer a:hover{color:var(--indigo)}
  footer .sep{opacity:.5; margin:0 9px}

  /* reveal */
  .reveal{opacity:0; transform:translateY(18px); animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards}
  .reveal.d1{animation-delay:.06s} .reveal.d2{animation-delay:.16s} .reveal.d3{animation-delay:.26s}
  @keyframes rise{to{opacity:1; transform:none}}

  @media (max-width:720px){
    .byline{margin-top:50px}
    .cards{grid-template-columns:1fr; gap:18px; margin-top:40px}
    footer{margin:46px 0 40px}
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="wrap">

    <header class="hero reveal d1">

    <div class="byline reveal"></div>
      <h1><span class="hl">AI 生产力工具</h1>
      <!-- <div class="en">AI-powered productivity tools by limao</div> -->


      <div class="divider"></div>
    </header>

    <section class="cards">
      <!-- Dagong -->
       <a class="btn" target="_blank" href="./Dagong/">
      <article class="card reveal d2">

        <h2><span class="dot"></span>Dagong 大工</h2>
        <!-- <div class="role">AI Agent 工作台</div> -->
        <p class="role">AI Agent 工作台，另一个 WorkBuddy</p>
        <div class="feats">
          <span>Claw</span>
          <span>Work</span>
          <span>专家团</span>
        </div>
        <br/>
        <img width=440 src="https://raw.githubusercontent.com/polimao/Dagong/master/src/asset/img/code.gif" alt="">
      </article>
    </a>

          <a class="btn" target="_blank" href="./rixing/">
      <!-- RiXing -->
      <article class="card reveal d3">
        <h2><span class="dot"></span>RiXing 日行</h2>
        <div class="role">菜单栏生产力 + 端侧 AI = 一个就够了</div>
        <div class="feats">
          <span>待办 / 日历 / 窗口管理</span>
          <span>本地 AI 翻译</span>
          <span>本地 AI 音乐</span>
        </div>
<br/>
        <img width=440  src="https://raw.githubusercontent.com/polimao/rixing/main/assets/preview.gif" alt="">
      
          <!-- <a class="ghost" href="https://github.com/polimao/rixing" target="_blank" rel="noopener">GitHub</a> -->

      </article>
      </a>
    </section>

    <footer>

      <a href="https://github.com/polimao" target="_blank" rel="noopener">© 2026 polimao 李貌　GitHub</a>
    </footer>
  </div>
</body>
</html>
